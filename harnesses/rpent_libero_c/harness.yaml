# RPent on LIBERO-PRO for plan C (research/c/README.md): evaluation only, with the oracle switches of
# patches/rpent/rpent_oracle_c.patch. The planner keeps the paper's evaluation sampling (top-p 0.95, top-k 20,
# presence penalty 1.5, seed 3407) and every call is recorded by the proxy in passthrough mode; after each
# episode research/c/self_probe.py asks the planner, with its full context, how likely the task succeeded.
#
# Needs, in the environment of the controller (research/c/c.env.example):
#   RPENT_DIR        RPent f70d720 + patches/rpent/rpent_f70d720.patch + patches/rpent/rpent_oracle_c.patch
#                    (research/c/setup_rpent.sh)
#   RPENT_ENV        RPent's Python environment (with LIBERO-PRO)
#   PLANNER_ENV      an environment with vLLM 0.28
#   PI05_CHECKPOINT  the frozen VLA (RLinf-Pi05-LIBERO-130-fullshot-SFT);  SAM3_CHECKPOINT  sam3.pt
#
# research/c/run_cell.sh supplies every {var}: gpu, model_port, proxy_port, vla_port, sam3_port, oracle_info,
# oracle_dynamics, vllm_mem, max_model_len, max_turns.
name: rpent_libero_c
adapter: rpent_libero
tasks: ../rpent_libero/tasks.jsonl     # each stage passes its own subset with --tasks (research/c/tasks/)
group_size: 6                         # not used by evaluations
episodes_parallel: 3                  # episodes sharing one GPU (vLLM, Pi0.5 and SAM3 on a 72 GB card)
proxy_port: "{proxy_port}"
model:
  url: http://127.0.0.1:{model_port}
  serve_cmd: >-
    CUDA_VISIBLE_DEVICES={gpu} $PLANNER_ENV/bin/vllm serve {weights} --served-model-name {weights}
    --host 127.0.0.1 --port {model_port} --tensor-parallel-size 1 --max-model-len {max_model_len} --max-num-seqs 4
    --gpu-memory-utilization {vllm_mem} --limit-mm-per-prompt.video 0 --limit-mm-per-prompt.image 128
    --enable-prefix-caching --enable-auto-tool-choice --generation-config auto
    --tool-call-parser qwen3_coder --reasoning-parser qwen3
  ready_timeout_s: 1800
services:
  - name: pi05
    cmd: >-
      PI05_CHECKPOINT_PATH=$PI05_CHECKPOINT $RPENT_ENV/bin/python -m rpent.robots.components.pi05_vla_server
      --transport http --host 127.0.0.1 --port {vla_port} --cuda-device {gpu}
    ready_timeout_s: 900
  - name: sam3
    cmd: >-
      SAM3_CHECKPOINT_PATH=$SAM3_CHECKPOINT $RPENT_ENV/bin/python -m rpent.robots.components.sam3_server
      --transport http --host 127.0.0.1 --port {sam3_port} --cuda-device {gpu}
    ready_timeout_s: 900
episode:
  # the layout the rpent_libero adapter expects: <run id>/<suite>/task_XX/seed_XXX/attempt_KK
  dir: "local/{suite}/task_{task:02d}/seed_{init_id:03d}/attempt_{attempt:02d}"
  cwd: $RPENT_DIR
  timeout_s: 7500                     # RPent's own limit is --planner-timeout-s 7200; this one only catches a hung process
  env: {MUJOCO_GL: egl, PYOPENGL_PLATFORM: egl, OPENAI_API_KEY: EMPTY}
  # the evaluation protocol of the paper (eval.cmd of harnesses/rpent_libero) + the two oracle switches
  cmd: >-
    $RPENT_ENV/bin/python -m rpent.cli.main --robot libero --libero-type pro
    --suite {suite} --task {task} --seed {init_id} --output-dir {episode_dir} --cuda-device {gpu}
    --base-url {model_url}
    --vla-endpoint http://127.0.0.1:{vla_port} --sam3-endpoint http://127.0.0.1:{sam3_port}
    --planner api --model openai-chat:{weights} --knowledge-profile proven --no-send-back-thinking --reasoning-effort low
    --max-turns {max_turns} --max-tokens 32768 --planner-timeout-s 7200
    --temperature 1.0 --top-p 0.95 --top-k 20 --presence-penalty 1.5 --generation-seed 3407
    --oracle-info {oracle_info} --oracle-dynamics {oracle_dynamics}
  # after the episode, with the model server still up: the planner's own success probability (A0 probe)
  result_cmd: >-
    {python} {config_dir}/../../research/c/self_probe.py --episode-dir {episode_dir}
    --model-url http://127.0.0.1:{model_port}/v1 --model {weights}
eval:
  passthrough: true                   # through the recording proxy, keeping the sampling above
build:
  turns_per_episode: 16
